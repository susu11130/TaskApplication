services:
  db:
    image: postgres:16
    container_name: taskapplication-db
    environment:
      POSTGRES_USER: generaluser
      POSTGRES_PASSWORD: generaluser
      POSTGRES_DB: task_db
    ports:
      - "5433:5432"
    volumes:
      - task-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U generaluser -d task_db" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  task-postgres-data:
