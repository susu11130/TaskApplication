<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="stylesheet" th:href="@{/css/task_new.css}">
	<title>タスク新規登録</title>
</head>

<body>

	<a th:href="@{/task}">一覧へ戻る</a>
	<main class="task-container">
		<div class="page-header">
			<h2>タスク新規登録</h2>

			<form th:action="@{/task/register}" method="post">
				<button type="submit" class="register-button">登録</button>
		</div>

		<table>
			<thead>
				<tr>
					<th class="colspan-id">ID</th>
					<th class="colspan-title">タイトル</th>
					<th class="colspan-category">カテゴリ</th>
					<th class="colspan-dueDate">期限</th>
				</tr>
			</thead>

			<tbody>
				<tr>
					<td><input type="text" placeholder="ID"></td>
					<td><input type="text" placeholder="タイトル"></td>
					<td>
						<select name="category">
							<option value="">選択してください</option>
							<option value="Java">Java</option>
							<option value="Spring">Spring</option>
							<option value="その他"></option>
						</select>
					</td>
					<td><input type="date" placeholder="期限"></td>
				</tr> 
			</tbody>
		</table>
		</form>
	</main>


</body>

</html>
