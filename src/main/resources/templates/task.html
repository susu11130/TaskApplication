<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!--/* 利用者の明暗設定を先に判定する。登録モーダルもhtmlのテーマを引き継ぐ。 */-->
  <script th:src="@{/js/theme.js}"></script>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <!--/* CSS */-->
  <link rel="stylesheet" th:href="@{/css/task.css}">
  <link rel="stylesheet" th:href="@{/css/register_modal.css}">
  <script src="https://code.jquery.com/jquery-4.0.0.min.js" defer></script>
  <!-- Bootstrapのモーダルを動かすJS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>
  <script th:src="@{/js/task.js}" defer></script>
  <title>タスク管理アプリケーション</title>
</head>

<body>

  <div th:if="${successMessage != null}" class="toast-message toast-success" th:text="${successMessage}"></div>
  <div th:if="${errorMessage != null}" class="toast-message toast-error" th:text="${errorMessage}"></div>

  <main class="task-container">

    <div class="page-header">
      <h4>タスク管理アプリケーション</h4>

      <button type="button" id="open-register-modal" class="register-button" data-bs-toggle="modal" data-bs-target="#register-modal">新規登録</button>
    </div>

    <table>
      <thead>
        <tr>
          <th class="colspan-id">ID</th>
          <th class="colspan-title">タイトル</th>
          <th class="colspan-category">カテゴリ</th>
          <th class="colspan-dueDate">期限</th>
          <th class="colspan-edit">編集</th>
          <th class="colspan-delete">削除</th>
        </tr>
      </thead>

      <tbody id="task-table-body">
        <tr th:each="task :${tasks}" th:attr="data-version=${task.version}">
          <td class="task-id" th:text="${task.id}">ID</td>

          <td class="task-title">
            <span class="title-display" th:text="${task.title}">タイトル</span>
            <input type="text" class="title-input form-control"
             name="title" maxlength="50" placeholder="タスクのタイトルを入力" th:value="${task.title}" hidden>
            <span class="title-error text-danger"></span>
           </td>

          <td class="task-category">
            <span class="category-display" th:text="${task.category}">カテゴリ</span>
            <select class="category-input form-select" name="category" hidden>
              <option value="" th:selected="${task.category == null or task.category == ''}">選択してください</option>
              <option value="Java" th:selected="${task.category == 'Java'}">Java</option>
              <option value="Spring" th:selected="${task.category == 'Spring'}">Spring</option>
              <option value="その他" th:selected="${task.category == 'その他'}">その他</option>
            </select>
            <span class="category-error text-danger"></span>
          </td>

          <td class="task-dueDate">
            <span class="dueDate-display" th:text="${task.dueDate}">期限</span>
            <input type="date" class="dueDate-input form-control" name="dueDate" th:value="${task.dueDate}" hidden>
            <span class="dueDate-error text-danger"></span>
          </td>

          <td class="action-icon">
            <button type="button" class="edit-task-button" aria-label="編集" title="編集">
              <img th:src="@{/images/edit_icon.png}" alt="">
            </button>
          </td>
          <td class="action-icon">
            <button type="button" class="delete-task-button" aria-label="削除" title="削除">
              <img th:src="@{/images/delete_icon.png}" alt="">
            </button>
          </td>
        </tr>
      </tbody>
    </table>

  </main>
  <!--/* タスク登録モーダル */-->
  <div th:replace="~{register_modal :: registerModal}"></div>
</body>

</html>
